name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Nu HTML Checker. The pin is by immutable release tag (20.6.30, the
      # newest versioned release that ships a runnable jar), not by the rolling
      # "latest" asset id, which GitHub replaces and which then returns 404.
      # The sha256 of the zip is verified before anything is extracted or run
      # (T-05-01). A different file fails the check; it never runs. The Maven
      # Central nu.validator:validator artifact is a thin library jar with no
      # Main-Class, so it cannot be used with java -jar.
      - name: Download and verify Nu HTML Checker
        env:
          VNU_TAG: "20.6.30"
          VNU_ZIP_SHA256: f6dc1464229756f582bdd6c083df11ec13e0d7389dd50b56e63133aa8b0dd200
        run: |
          curl -fsSL \
            -o "${RUNNER_TEMP}/vnu.zip" \
            "https://github.com/validator/validator/releases/download/${VNU_TAG}/vnu.jar_${VNU_TAG}.zip"
          echo "${VNU_ZIP_SHA256}  ${RUNNER_TEMP}/vnu.zip" | sha256sum -c -
          unzip -q -j -o "${RUNNER_TEMP}/vnu.zip" dist/vnu.jar -d "${RUNNER_TEMP}"

      # The pinned 20.6.30 validator predates two things the video slot needs, so exactly two
      # messages are filtered, both on the iframe element and nothing else: the loading
      # attribute (lazy loading, UI-SPEC "iframe loading") and the sandbox pair allow-scripts
      # with allow-same-origin (needed by third-party video players; the frame is cross-origin).
      - name: Validate HTML with the Nu HTML Checker
        run: |
          java -jar "${RUNNER_TEMP}/vnu.jar" --version
          find . -name '*.html' -not -path '*/node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 java -jar "${RUNNER_TEMP}/vnu.jar" --errors-only \
                --filterpattern 'Attribute .loading. not allowed on element .iframe. at this point.|Bad value .allow-scripts allow-same-origin allow-presentation. for attribute .sandbox. on element .iframe.*'

      - name: i18n and ARIA structure guard
        run: bash scripts/check-i18n-a11y.sh

      - name: Guard self-test
        run: bash scripts/check-i18n-a11y.test.sh

      - name: CSP guard
        run: bash scripts/check-csp.sh

      - name: CSP guard self-test
        run: bash scripts/check-csp.test.sh

      - name: Check local links and fragments (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments --exclude-path node_modules './**/*.html' './**/*.md'
          fail: true

      # Tooling for the checks below: one pinned dependency (lighthouse, exact version) installed
      # from package-lock.json with install scripts disabled (T-06-SC). The site has no build step.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install tooling
        run: npm ci --ignore-scripts

      - name: Meta check
        run: |
          node scripts/check-meta.mjs --self-test
          node scripts/check-meta.mjs --strict

      - name: i18n parity
        run: |
          node scripts/check-i18n-parity.mjs --self-test
          node scripts/check-i18n-parity.mjs

      - name: Contrast
        run: node scripts/check-contrast.mjs

      - name: Browser scenarios
        run: node scripts/ui-check.mjs

      - name: Lighthouse gate
        run: node scripts/lighthouse-check.mjs
